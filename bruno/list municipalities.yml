info:
  name: list municipalities
  type: http
  seq: 2

http:
  method: GET
  url: "{{API_BASE_URL}}/municipalities?page_size=20&search=Asi"
  params:
    - name: page_size
      value: "20"
      type: query
    - name: page
      value: "2"
      type: query
      disabled: true
    - name: paginate
      value: "false"
      type: query
      disabled: true
    - name: state_id
      value: "01"
      type: query
      disabled: true
    - name: search
      value: Asi
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
