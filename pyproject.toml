[project]
name = "back-geodata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.20.1",
	"fastapi>=0.162.0",
	"geoalchemy2>=0.20.0",
	"psycopg[binary]>=3.3.6",
	"pydantic>=2.14.2",
	"pydantic-settings>=2.16.2",
	"sqlalchemy>=2.1.6",
	"typer>=0.21.1",
	"uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
